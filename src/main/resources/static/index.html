<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ModaFácil</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">

    <main class="login-container">
        <section class="login-apresentacao">
            <h1>ModaFácil</h1>
            <p>Sistema de gerenciamento para lojas de moda.</p>
        </section>

        <section class="login-card">
            <h2>Entrar no sistema</h2>
            <p class="login-subtitulo">Informe seus dados de acesso</p>

            <form id="formLogin">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="admin@modafacil.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="botao-principal">
                    Entrar
                </button>

                <p id="mensagemLogin" class="mensagem"></p>
            </form>

            <div class="dados-demonstracao">
                <strong>Acesso para demonstração:</strong>
                <p>E-mail: admin@modafacil.com</p>
                <p>Senha: 123456</p>
            </div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
